# Configuration file for the skill generator (vendored from flutter/agent-plugins).
# Regenerate the SKILL.md files (from the repository root):
#
#   dart run tool/generator/bin/skills.dart generate-skill \
#       resources/flutter_tizen_skills.yaml \
#       --directory skills
#
# Requires GEMINI_API_KEY for live generation. Hand-review every output —
# Tizen-specific CLI flags, plugin names, and privilege URLs hallucinate easily.

- name: flutter-tizen-setup
  description: Install and verify the flutter-tizen toolchain (Tizen SDK, sdb,
    certificate profile, flutter-tizen CLI). Use when bootstrapping a new
    development host, when `flutter-tizen doctor` reports missing components,
    when `sdb` or `tizen` CLI is not found or a certificate profile is missing,
    or before a clean-room device build.
  examplePrompt: "Set up flutter-tizen on a fresh Ubuntu 24.04 host and confirm doctor is green"
  instructions: |
    1. **Verify host prerequisites.** 64-bit Linux (Ubuntu 22.04 / 24.04
       verified), macOS x64, or Windows x64. `git`, `unzip`, `bash`, Python 3
       on `PATH`. For the Tizen emulator, HW virtualization must be on.
    2. **Install the Tizen SDK** via the VS Code Extension for Tizen (Tizen
       Studio 6.1 standalone is also fine if already installed). Use the
       Tizen Package Manager to install `[Advanced] 6.0 IOT-Headed + Mobile`
       and, if emulators are needed, `[Advanced] 9.0` plus the relevant
       emulator image.
    3. **Put `sdb` and `tizen` on `PATH`** and verify with `sdb version` and
       `tizen version`. On Windows, add the SDK `tools` directory to the
       user `Path` instead.
    4. **Clone flutter-tizen** from github.com/flutter-tizen/flutter-tizen,
       put `bin/` on `PATH` ahead of any upstream `flutter`, and run
       `flutter-tizen --version` to bootstrap the pinned Flutter SDK. On
       Windows, add `flutter-tizen\bin` to the user `Path`.
    5. **Create a Samsung certificate profile** via Certificate Manager (or
       `tizen security-profiles add`). Tizen refuses to install unsigned
       packages even on the emulator.
    6. **Run `flutter-tizen doctor -v`** and resolve every red item before
       continuing. `Currently on an unknown channel` can be ignored.
    7. **Smoke-build.** `flutter-tizen create demo && cd demo &&
       flutter-tizen build tpk --debug --device-profile common` must succeed
       end-to-end.
  resources:
    - https://github.com/flutter-tizen/flutter-tizen
    - https://github.com/flutter-tizen/flutter-tizen/blob/master/doc/windows-install.md
    - https://github.com/flutter-tizen/flutter-tizen/wiki/Tizen-SDK
    - https://docs.tizen.org/application/vstools/install-vstools

- name: flutter-tizen-build-tpk
  description: Build, sign, and inspect Tizen TPK packages for Flutter apps
    with `flutter-tizen build tpk`. Use when producing a deployable artifact
    for a specific device profile (`common` or `tv`), when troubleshooting
    signing failures, when a TPK install fails with signing or architecture
    mismatch errors, or when controlling ABI / build mode for emulator vs.
    real device.
  examplePrompt: "Build a signed release TPK for Samsung TV 2022"
  instructions: |
    1. **Confirm `tizen/tizen-manifest.xml` matches the target.** `<manifest
       profile="...">` and `api-version` must match the device profile (e.g.
       `tv` + `6.5` for a 2022 TV). `x64` builds require `api-version="8.0"`
       or newer; the default generated `6.0` manifest fails on x64.
    2. **Pick the build mode.** `--debug` (JIT, required for any emulator)
       or `--release` (AOT, signed for store, default). `--profile` for
       tracing builds on real hardware.
    3. **Pick the device profile** with `--device-profile {common|tv}`. The
       default is `tv`, so always pass it explicitly. TV requires `tv` and a
       `common` package will not install on a Samsung TV; phone, IoT-Headed,
       and Raspberry Pi targets use `common`. `mobile` / `wearable` profiles
       are gone (use flutter-tizen 3.16.2 or older for Galaxy Watch).
    4. **Pick the ABI** with `--target-arch {arm|arm64|x86|x64}` to match the
       device CPU. Real TVs / RPi are `arm` or `arm64`; the Tizen 10.0 TV
       emulator and the common 10.x emulator are `x64`; only TV 9.0 and older
       images are `x86`. Read the arch with `sdb -s <id> capability | grep
       cpu_arch` — **not** `sdb shell uname -m`, which the secured TV emulator
       blocks (returns nothing).
    5. **Pick the certificate** with `--security-profile <name>` when the
       active profile is wrong. Distributor certs must register the DUID of
       every device you side-load to.
    6. **Run** `flutter-tizen build tpk` with the chosen flags. The TPK lands
       in `build/tizen/tpk/`.
    7. **Verify by installing** on the target: `sdb -s <id> install
       build/tizen/tpk/<file>.tpk` must end with `key[end]   val[ok]`.
       Inspect contents with `unzip -l <tpk>` and the manifest with
       `unzip -p <tpk> tizen-manifest.xml`.
    8. **Diagnose signing failures.** `tizen security-profiles list` to
       confirm the profile exists; a `not authorized` install error means the
       device DUID is missing from the distributor cert — re-issue and rebuild.
  resources:
    - https://github.com/flutter-tizen/flutter-tizen/wiki/Build-an-app
    - https://docs.tizen.org/application/tizen-studio/native-tools/manifest-text-editor
    - https://docs.tizen.org/application/native/tutorials/sign-certificate

- name: flutter-tizen-device
  description: Connect to and run Flutter apps on Tizen devices and emulators
    using `sdb` and `flutter-tizen run`. Use when bringing up a
    TV / RPi / emulator target, when `sdb devices` shows offline or
    unauthorized, when reading app logs, or when attaching a
    debugger to a running app.
  examplePrompt: "Connect my TV at 192.168.0.101, run the app, and read its logs"
  instructions: |
    1. **Enable Developer Mode on the device.** TV: Apps → enter `12345`,
       toggle Developer Mode, set host IP. Watch / RPi / IOT: enable in
       Settings or via the wiki recipe.
    2. **Connect over the network.** `sdb connect <ip>:26101`. Verify with
       `sdb devices` — status must be `device`, not `offline` or
       `unauthorized`.
    3. **List flutter-tizen targets.** `flutter-tizen devices` should show
       the same device ID (e.g. `192.168.0.101:26101` or
       `emulator-26101`).
    4. **Run the app.** `flutter-tizen run -d <device-id>` for debug;
       `--release` and `--profile` are supported.
    5. **Read logs from the foreground `flutter-tizen run` session.** It
       streams Dart `print`/`debugPrint` and Flutter engine messages; add
       `2>&1 | tee app.log` to capture. On Tizen TV targets `sdb` is locked
       down (`sdb capability` shows `secure_protocol:enabled`,
       `intershell_support:disabled`), so `sdb dlog` / `sdb shell` return
       nothing — the `run` console is the only log channel that works there.
       `sdb dlog` works only on the common emulator / RPi where `sdb shell`
       is available.
    6. **Attach a debugger.** `flutter-tizen run` prints the Dart VM Service
       URL. Open it in DevTools, or `flutter-tizen attach -d <device-id>` to
       hot-reload into a running app.
    7. **Disconnect cleanly.** `sdb disconnect <ip>:26101` when finished;
       leftover offline entries break the next `flutter-tizen run`.
  resources:
    - https://github.com/flutter-tizen/flutter-tizen/wiki/Run-an-app
    - https://docs.tizen.org/application/tizen-studio/common-tools/smart-development-bridge
    - https://docs.tizen.org/application/tizen-studio/common-tools/log-view

- name: flutter-tizen-tv-remote-input
  description: Make a Flutter-Tizen UI navigable with the Samsung TV remote —
    wire up D-pad focus traversal, OK/Back handling, color keys, and media
    keys using Flutter's `Focus`/`FocusNode`/`Shortcuts`/`Actions`. Use when
    targeting Samsung TV 2021+, when focus jumps incorrectly, or when remote
    keys do nothing in a Flutter view.
  examplePrompt: "Make the home screen navigable with the TV remote, including OK to activate and Back to pop"
  instructions: |
    1. **Wrap every focusable widget** in a `Focus`, `FocusableActionDetector`,
       or built-in widget that already takes focus (`ElevatedButton`,
       `InkWell`). Plain `GestureDetector` is invisible to focus traversal.
    2. **Group focusable areas** with `FocusTraversalGroup` plus a policy
       (`OrderedTraversalPolicy`, `ReadingOrderTraversalPolicy`,
       `WidgetOrderTraversalPolicy`). Without a group, the D-pad jumps
       unpredictably between rows / columns.
    3. **Map remote keys to actions** with `Shortcuts` and `Actions`. D-pad
       arrives as `LogicalKeyboardKey.arrowUp/Down/Left/Right` (drives
       traversal automatically); OK is `select` **and** `enter` (map both —
       firmware varies); Back is `goBack` / `escape`. Color keys are
       `colorF0Red`, `colorF1Green`, `colorF2Yellow`, `colorF3Blue` (not
       `f1`–`f4`); media keys are `mediaPlay` / `mediaPause` /
       `mediaTrackNext` / etc.
    4. **Show a focus highlight.** TVs sit ~3m away — invisible focus
       guarantees lost users. Use `FocusableActionDetector` with
       `onShowFocusHighlight`, or override the theme's focused state colors.
    5. **Handle Back explicitly.** `LogicalKeyboardKey.escape` from the
       remote should pop a route (`Navigator.maybePop`); without it, the
       device exits the app.
    6. **Verify with the emulator's on-screen control panel or a paired host
       keyboard** (arrows = D-pad, Enter = OK, Esc/Backspace = Back). There is
       no sdb key-injection path on the TV emulator, and `sdb shell
       input_keyevent` does not reach the Flutter embedder even on the common
       emulator — do not rely on it. There is no `flutter-tizen logs` command;
       watch key events from the foreground `flutter-tizen run` console (or
       `flutter-tizen attach`).
  resources:
    - https://github.com/flutter-tizen/flutter-tizen/wiki/TV-app-development
    - https://docs.tizen.org/application/web/guides/tv/key-events
    - https://api.flutter.dev/flutter/widgets/Focus-class.html
    - https://api.flutter.dev/flutter/widgets/Shortcuts-class.html

- name: flutter-tizen-use-plugins
  description: Pick and wire up Tizen-side Flutter plugins (Samsung-maintained
    `*_tizen` packages and Tizen-exclusive plugins such as
    `tizen_app_control`, `messageport_tizen`, `permission_handler_tizen`).
    Use when a cross-platform plugin lacks Tizen support, when needing a
    Tizen-only feature (app-control, messageport, package manager), when a
    Tizen plugin throws `PRIVILEGE_DENIED` / crashes at runtime due to a
    missing privilege, or when declaring privileges in `tizen-manifest.xml`.
    Covers privilege declaration + runtime permission for *any* `*_tizen`
    plugin.
  examplePrompt: "Add location support to my app on Tizen, including the privilege declaration"
  instructions: |
    1. **Look up the right plugin** in the github.com/flutter-tizen/plugins
       index. Three classes exist: endorsed `<name>_tizen` (pulled in
       automatically by its base plugin — **rare**; most upstream first-party
       plugins are *not* endorsed), unendorsed `<name>_tizen` (the common
       case — you must add it explicitly), and Tizen-exclusive
       (`tizen_app_control`, `messageport_tizen`, `tizen_package_manager`,
       `tizen_log`, `tizen_notification`, `tizen_app_manager`,
       `tizen_bundle`, …). Name only packages that exist in that repo —
       there is no `vibration_tizen`, `flutter_local_notifications_tizen`,
       `tizen_system_info`, `audio_session_tizen`, or `app_settings_tizen`;
       system info comes from `device_info_plus` + `device_info_plus_tizen`
       and notifications from `tizen_notification`. Assume unendorsed unless
       you confirm endorsement in the base plugin's `pubspec.yaml`
       (`flutter.plugin.platforms.tizen`).
    2. **Add the dependency** with `flutter-tizen pub add <plugin>`. For
       unendorsed federated plugins add **both** the base and the `_tizen`
       sibling (e.g. `shared_preferences` *and* `shared_preferences_tizen`),
       or every call throws `MissingPluginException`. Tizen-exclusive plugins
       are added directly.
    3. **Run `flutter-tizen pub get`** — vanilla `flutter pub get` will not
       register the Tizen platform interface.
    4. **Declare required privileges in `tizen/tizen-manifest.xml`.** Each
       plugin lists them in its README; copy them under `<privileges>` (e.g.
       `http://tizen.org/privilege/location`,
       `http://tizen.org/privilege/internet`). Add a matching `<feature>`
       for hardware-backed APIs.
    5. **Request privacy privileges at runtime** by depending on both
       `permission_handler` and `permission_handler_tizen` and importing
       `package:permission_handler/permission_handler.dart`. The runtime
       request returns `denied` instantly unless the matching `<privilege>`
       is also in the manifest.
    6. **Rebuild the TPK.** Manifest changes do not hot-reload — reinstall
       from a fresh `flutter-tizen build tpk` / `flutter-tizen run`. When
       swapping endorsed ↔ unendorsed, run `flutter-tizen clean` first.
    7. **Verify at runtime from the foreground `flutter-tizen run` console**
       (on TV targets `sdb` is locked down, so that console is the only log
       channel). Wrap calls in `try` / `on PlatformException` and `debugPrint`
       the `e.code` / `e.message` so a native `permission denied` surfaces.
       Dart/FFI plugins (`shared_preferences_tizen`, `path_provider_tizen`)
       ship no native `.so` — that is normal, not a packaging failure.

    When documenting `messageport_tizen`, the receive callback typedef is
    `void Function(dynamic message, [RemotePort? remotePort])` — a sample
    lambda with a `Map`-typed required second parameter does not compile.
  resources:
    - https://github.com/flutter-tizen/plugins
    - https://github.com/flutter-tizen/plugins/tree/master/packages/permission_handler
    - https://github.com/flutter-tizen/plugins/blob/master/packages/messageport/lib/messageport_tizen.dart
    - https://docs.tizen.org/application/native/guides/security/privilege-list
    - https://docs.tizen.org/application/dotnet/get-started/manifest

- name: flutter-tizen-create-plugin
  description: Scaffold a new Tizen-side Flutter plugin (C++ or C#), wire it
    to Dart through a method channel, declare the right privileges in
    `tizen-manifest.xml`, and validate it against a device or emulator. Use
    when creating a new Flutter plugin for Tizen, when no existing Tizen plugin
    wraps a needed Tizen Native API, when a plugin's C++ build fails with link
    errors, or when extending a cross-platform plugin with a `_tizen`
    implementation.
  examplePrompt: "Wrap the Tizen system_info API as a new system_info_tizen plugin"
  instructions: |
    1. **Scaffold the package.**
       ```
       flutter-tizen create --platforms tizen --template plugin \
           --tizen-language cpp --org com.example my_plugin_tizen
       ```
       The C++ scaffold is the reusable default; use `--tizen-language csharp`
       only when the host app is C# and the underlying API is .NET-only.
    2. **Find the Tizen Native API** in
       docs.tizen.org/application/native/api/<profile>/<version>/group/.
       Note the privileges and the `pkg-config` module the API belongs to
       (e.g. `capi-system-info`).
    3. **Wire the C++ side** in `tizen/src/`. In `RegisterWithRegistrar`
       create the `MethodChannel`, dispatch in the handler on
       `call.method_name()`, return `result->Success(...)` /
       `result->Error(...)` / `result->NotImplemented()`. `free()` any
       `char *` a Tizen API returns after copying it into a `std::string`.
    4. **Add native packages** in `tizen/project_def.prop`. The fresh
       scaffold ships only:
       ```
       type = staticLib
       USER_SRCS += src/*.cc
       USER_INC_DIRS = inc src
       ```
       Add `USER_PKGS` yourself for `capi-*` / `dlog` / `vconf` pkg-config
       modules (e.g. `USER_PKGS = capi-system-info`). `capi-*` go in
       `USER_PKGS`, never `USER_LIBS` (wrong field fails at link with
       `undefined reference`); `USER_LIBS` is only for plain libs / `sharedLib`
       plugins.
    5. **Declare privileges and features** in the example app's
       `example/tizen/tizen-manifest.xml` (the scaffold ships none) and
       document them in the README — the consumer app's manifest is what the
       OS evaluates at runtime. Include `<feature>` selectors for hardware
       APIs. See flutter-tizen-use-plugins for privilege categories.
    6. **Expose the Dart API** in `lib/my_plugin_tizen.dart` via a
       `MethodChannel('my_plugin_tizen')` whose name matches the C++ side.
    7. **Validate via the example app.** `cd example && flutter-tizen run
       -d <device-id>`, exercise each method, and watch the foreground `run`
       console — bridge native results/errors to Dart (`debugPrint`,
       `PlatformException`) because the template `LOGI` / `LOGE` dlog macros
       are **not readable on the Samsung TV emulator** and never appear in the
       `run` console.
    8. **Add tests.** A `flutter_test` widget test mocking the method channel,
       plus an `integration_test` on a real device for the happy-path call.
    9. **Document privileges and constraints** in the package README so
       consumers know what to add to their own `tizen-manifest.xml`.
  resources:
    - https://github.com/flutter-tizen/flutter-tizen/wiki/Develop-a-plugin
    - https://github.com/flutter-tizen/plugins
    - https://docs.tizen.org/application/native/api/wearable/latest/index.html
    - https://docs.flutter.dev/packages-and-plugins/developing-packages

- name: flutter-tizen-plugin-regression-test
  description: Run regression tests for flutter-tizen plugins after changes to
    flutter-tizen tool, embedder, or engine. Executes example apps and
    integration tests on TV emulator, analyzes logs, and generates issue
    reports. Use when validating plugin compatibility after flutter-tizen
    updates, or when running CI-style plugin verification.
  examplePrompt: "Run a regression test for connectivity_plus on the TV 9.0 emulator"
  instructions: |
    1. **Verify the environment.** `flutter-tizen doctor -v`, `sdb version`,
       `tizen version`, and `tizen security-profiles list` must all pass, and
       the `flutter-tizen/plugins` repo must be available locally. Persist
       discovered paths to
       `~/.config/flutter-tizen-regression-test/config.json`.
    2. **Parse the user request** for device/emulator id, plugin name(s),
       profile, build mode, and skip options. User-specified values always
       win over defaults.
    3. **Select the device.** Use the user-specified id; otherwise launch the
       TV 9.0 emulator. Confirm with `sdb devices`.
    4. **Resolve the plugin list.** Use the user-named plugin(s); otherwise
       read `.github/recipe.yaml` and take the plugins whose profile list
       contains `tv-9.0`. Skip plugins with empty arrays.
    5. **Run each example app.** `cd packages/<plugin>/example &&
       timeout 300 flutter-tizen -d <id> run --debug > example_run.log 2>&1`
       (`run` stays attached until `q`, so unattended runs must bound it —
       `timeout` or background + kill). Do **not** use `sdb dlog` on the TV
       emulator — it is locked down (`secure_protocol:enabled`) and returns
       nothing, so a grep over the empty result silently reports a false
       PASS. The foreground `run` session is the only working log channel.
    6. **Analyze logs** case-insensitively for `Unhandled Exception:`,
       `EXCEPTION CAUGHT BY`, `PlatformException`, `SIGSEGV` / `SIGABRT`,
       `Failed to`, and `Error:`. Do **not** grep for dlog/logcat prefixes
       (`F/`, `E/FlutterEngine`, `E/FlutterJNI`) — they never appear in the
       run console, so they silently match nothing and report a false PASS.
    7. **Run integration tests** when `example/test_driver/` and
       `example/integration_test/` exist: `flutter-tizen drive
       --driver=test_driver/integration_test.dart
       --target=integration_test/<file>.dart -d <id> --debug`.
    8. **Generate an issue report** per failing plugin and a summary across
       all tested plugins, saved under
       `~/.config/flutter-tizen-regression-test/reports/`.
  resources:
    - https://github.com/flutter-tizen/plugins
    - https://github.com/flutter-tizen/flutter-tizen
    - https://github.com/flutter-tizen/plugins/blob/master/.github/recipe.yaml
    - https://docs.flutter.dev/testing/integration-tests
